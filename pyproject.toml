[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "kymocore"
version = "0.1.0"
description = "Send measurements from Python to KymoStudio (Kymotrace binary protocol)"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Christof Seidel" }]
keywords = ["kymotrace", "kymostudio", "telemetry", "plotting", "mqtt", "serial"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: System :: Hardware",
]

[project.optional-dependencies]
serial = ["pyserial>=3.5"]
mqtt = ["paho-mqtt>=2.0"]
test = ["pytest", "pyserial>=3.5", "paho-mqtt>=2.0"]

[project.urls]
Homepage = "https://kymotrace.de"
Source = "https://github.com/KymoTrace/kymocore-python"
Issues = "https://github.com/KymoTrace/kymocore-python/issues"
Protocol = "https://github.com/KymoTrace/kymocore/blob/main/PROTOCOL.md"
